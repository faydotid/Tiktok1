<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tebak Kata Live</title>
  </head>
  <body>
    <aside id="leaderboard" aria-label="Top viewer">
      <h2>🏆 TOP VIEWER</h2>
      <ol id="lb-list"></ol>
    </aside>

    <main id="app">
      <header>
        <h1 id="title">TEBAK KATA</h1>
        <p id="subtitle"></p>
        <div class="bar">
          <span id="round" class="chip">Ronde 1</span>
          <button id="pill" class="pill" type="button" title="">
            <i class="dot"></i><span id="pill-text">TIKTOK BELUM TERHUBUNG</span>
          </button>
          <button id="panel-btn" class="chip btn" type="button" aria-label="Pengaturan">⚙</button>
        </div>
      </header>

      <section id="panel" class="panel" hidden>
        <label for="username">Username TikTok (yang lagi LIVE)</label>
        <div class="row">
          <input id="username" type="text" placeholder="contoh: ruhulshop" autocomplete="off" />
          <button id="btn-connect" type="button">Hubungkan</button>
        </div>
        <div class="row">
          <button id="btn-disconnect" type="button">Putuskan</button>
          <button id="btn-skip" type="button">Kata baru</button>
          <button id="btn-reset" type="button">Reset skor</button>
        </div>
      </section>

      <div id="toast" class="toast" role="status"></div>

      <div class="legend">
        <span class="lg correct">Benar</span>
        <span class="lg present">Salah posisi</span>
        <span class="lg absent">Salah huruf</span>
      </div>

      <div id="hint" class="hint"></div>

      <div class="board-wrap">
        <div id="board" class="board"></div>
        <div id="result" class="result">
          <p id="result-title"></p>
          <p id="result-word"></p>
          <p id="result-sub"></p>
        </div>
      </div>

      <div id="keyboard" class="keyboard"></div>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
